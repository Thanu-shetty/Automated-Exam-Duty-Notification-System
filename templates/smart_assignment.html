{% extends "base.html" %}

{% block content %}
<div class="container-fluid">
    <h2>AI-Powered Duty Assignment</h2>
    
    <div class="card">
        <div class="card-header">
            <h5>Smart Assignment Configuration</h5>
        </div>
        <div class="card-body">
            <form id="smartAssignForm">
                <div class="row">
                    <div class="col-md-6">
                        <div class="form-group">
                            <label for="department">Select Department:</label>
                            <select class="form-control" id="department" name="department" required>
                                <option value="">Select Department</option>
                                {% for dept in departments %}
                                <option value="{{ dept }}">{{ dept }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-group">
                            <label for="mode">Assignment Mode:</label>
                            <select class="form-control" id="mode" name="mode">
                                <option value="balanced">Balanced (Recommended)</option>
                                <option value="expertise">Expertise-Based</option>
                                <option value="optimal">AI-Optimized</option>
                            </select>
                        </div>
                    </div>
                </div>
                
                <div class="mt-3">
                    <button type="submit" class="btn btn-primary" id="assignBtn">
                        <i class="fas fa-robot"></i> Generate AI Assignments
                    </button>
                </div>
            </form>
        </div>
    </div>

    <div id="assignmentResults" class="mt-4" style="display: none;">
        <div class="card">
            <div class="card-header">
                <h5>AI Assignment Results</h5>
            </div>
            <div class="card-body">
                <div id="resultsContent"></div>
                <div class="mt-3">
                    <button id="confirmAssignBtn" class="btn btn-success" style="display: none;">
                        Confirm Assignments
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div id="progressSection" class="mt-4" style="display: none;">
        <div class="card">
            <div class="card-header">
                <h5>Assignment Progress</h5>
            </div>
            <div class="card-body">
                <div class="progress">
                    <div id="assignmentProgress" class="progress-bar" role="progressbar" style="width: 0%"></div>
                </div>
                <div id="progressText" class="mt-2"></div>
            </div>
        </div>
    </div>
</div>

<script>
$(document).ready(function() {
    $('#smartAssignForm').on('submit', function(e) {
        e.preventDefault();
        
        const department = $('#department').val();
        const mode = $('#mode').val();
        
        $('#assignBtn').prop('disabled', true).html('<i class="fas fa-spinner fa-spin"></i> AI Analyzing...');
        
        $.ajax({
            url: '/api/smart-assign',
            method: 'POST',
            contentType: 'application/json',
            data: JSON.stringify({
                department: department,
                mode: mode
            }),
            success: function(response) {
                if (response.success) {
                    displayResults(response);
                } else {
                    alert('Error: ' + response.error);
                }
            },
            error: function() {
                alert('Error generating assignments');
            },
            complete: function() {
                $('#assignBtn').prop('disabled', false).html('<i class="fas fa-robot"></i> Generate AI Assignments');
            }
        });
    });
    
    function displayResults(response) {
        let html = `
            <div class="alert alert-success">
                <strong>AI Analysis Complete!</strong> ${response.message}
            </div>
            <h6>Top AI Insights:</h6>
        `;
        
        if (response.ai_insights && response.ai_insights.length > 0) {
            response.ai_insights.forEach(assignment => {
                html += `
                <div class="card mb-2">
                    <div class="card-body">
                        <h6>${assignment.faculty_name} → ${assignment.exam_name}</h6>
                        <small class="text-muted">
                            AI Score: ${(assignment.ai_score * 100).toFixed(1)}% | 
                            Confidence: ${(assignment.confidence * 100).toFixed(1)}%
                        </small>
                        <div class="mt-1">
                            ${assignment.ai_insights.map(insight => `<span class="badge badge-info mr-1">${insight}</span>`).join('')}
                        </div>
                    </div>
                </div>
                `;
            });
        }
        
        $('#resultsContent').html(html);
        $('#assignmentResults').show();
        $('#confirmAssignBtn').show();
    }
    
    $('#confirmAssignBtn').on('click', function() {
        // Implement assignment confirmation
        $('#progressSection').show();
        simulateProgress();
    });
    
    function simulateProgress() {
        let progress = 0;
        const interval = setInterval(() => {
            progress += 5;
            $('#assignmentProgress').css('width', progress + '%');
            $('#progressText').text(`Assigning duties... ${progress}%`);
            
            if (progress >= 100) {
                clearInterval(interval);
                $('#progressText').html('<strong>✓ Assignments completed! Notifications sent to faculty.</strong>');
            }
        }, 200);
    }
});
</script>
{% endblock %}
